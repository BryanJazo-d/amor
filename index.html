<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis recuerdos, mi vida, lo que fue mi felicidad</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<div class="fondo"></div>

<div class="contenedor">

    <div class="tarjeta">

        <h1>
            Mis recuerdos,<br>
            mi vida,<br>
            lo que fue mi felicidad
        </h1>

        <p class="mensaje">

            Hola, Diana.

            <br><br>

            Hay recuerdos que nunca dejan de existir.

            Solo esperan volver a encontrarnos.

            <br><br>

            Si llegaste hasta aquí...

            es porque recuerdas una fecha muy importante.

        </p>

        <input
            type="text"
            id="fecha"
            placeholder="Introduce esa fecha">

        <button onclick="entrar()">

            Abrir nuestros recuerdos ❤️

        </button>

        <p id="error"></p>

    </div>

</div>

<script src="script.js"></script>
